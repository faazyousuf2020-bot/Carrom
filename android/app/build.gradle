plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tenthill.carrom'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tenthill.carrom'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        // Same key for every build, so new versions install over old ones and keep your scores.
        tenthill {
            storeFile file('tenthill.keystore')
            storePassword 'tenthill123'
            keyAlias 'tenthill'
            keyPassword 'tenthill123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.tenthill
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
